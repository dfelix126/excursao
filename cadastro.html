<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Excursões Litoral PR</title>
</head>
<body>
    <header>
        <h2>Formulário de Cadastro</h2>
        
    </header>
    <main>
        <section>
            <h2>Preencha seus dados</h2>
            <form>

        <p> <label for="nomeCompleto">Nome completo:</label>
            <input type="text" id="nomeCompleto"></p>
        
        <p> <label for="campo-cpf"> CPF:</label>
            <input type="text" id="campo-cpf"></p>

        <p> <label for="campo-email"> E-mail:</label>
            <input type="email" id="campo-email"></p>

        <p> <label for="campo-rua"> Endereço completo:</label>
            <input type="text" id="campo-rua"></p>

        <p> <label for="campo-cidade"> Cidade:</label>
            <input type="text" id="campo-cidade"></p>

        <p> <label for="campo-estado"> Estado:</label>
            <input type="text" id="campo-estado"></p>

        <p> <label for="campo-pais"> País:</label>
            <input type="text" id="campo-pais"></p>

        <p> <label for="campo-senha"> Senha: </label>
            <input type="password" id="campo-senha"></p>

        <p> <button type="submit">Concluir Cadastro</button></p>
        
        <nav>
           <a href="index.html">Voltar para a Página Inicial</a> 
        </nav>

            </form>
        </section>

    </main>

        <footer>
        <p>© 2026 Portal de Turismo Felix. Todos os direitos reservados.</p>
        </footer>   
    
</body>
</html>
